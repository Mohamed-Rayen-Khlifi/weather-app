{% extends "base.html" %}


{% block title %}
Dashboard
{% endblock %}


{% block content %}


<div class="station">


<header class="masthead">

    <p class="eyebrow">
        Station météo
        <span class="sep">·</span>
        Tunis
    </p>


    <div class="masthead-row">

        <h1>
            Conditions actuelles
        </h1>


        <p class="sync">

            <span class="dot live"></span>

            Synchronisation...

        </p>


    </div>


</header>




<section class="readouts">


<div class="card card--hero">


<p class="card-label">
Temperature
</p>


<p class="card-value" id="temp-value">
--
<span class="unit">
°C
</span>
</p>


<p class="card-time" id="temp-time">
--
</p>


</div>





<div class="card" id="humidity-card">


<p class="card-label">
Humidity
</p>


<p class="card-value" id="humidity-value">
--
<span class="unit">
%
</span>
</p>


<p class="card-time" id="humidity-time">
--
</p>


</div>






<div class="card" id="wind-card">


<p class="card-label">
Wind
</p>


<p class="card-value" id="wind-value">
--
<span class="unit">
km/h
</span>
</p>


<p class="card-time" id="wind-time">
--
</p>


</div>






<div class="card" id="pressure-card">


<p class="card-label">
Pressure
</p>


<p class="card-value" id="pressure-value">
--
<span class="unit">
hPa
</span>
</p>


<p class="card-time" id="pressure-time">
--
</p>


</div>


</section>





<section class="history">


<div class="history-head">

<h2>
Temperature History
</h2>


<p class="history-meta">
Last measurements
</p>


</div>



<div class="chart-wrap">

<canvas id="tempChart"></canvas>

</div>


</section>






<section class="controls">


<button id="refreshBtn">
Refresh
</button>


</section>



</div>



<script src="/static/js/dashboard.js"></script>


{% endblock %}
